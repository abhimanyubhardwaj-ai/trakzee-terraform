<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="600" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#0F172A">Trakzee ECS Architecture</text>
  <text x="600" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#475569">Terraform-managed ECS environment with shared ALB, tasks, and autoscaling</text>

  <rect x="80" y="140" width="1040" height="500" rx="24" fill="url(#panel)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <rect x="120" y="215" width="180" height="120" rx="18" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <text x="210" y="258" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1E3A8A">Internet</text>
  <text x="210" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#1E3A8A">Client traffic</text>

  <path d="M300 275 H420" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <polygon points="420,275 404,267 404,283" fill="#64748B"/>

  <rect x="420" y="190" width="250" height="170" rx="22" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
  <text x="545" y="232" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#166534">Application Load Balancer</text>
  <text x="545" y="260" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#166534">Shared ALB</text>
  <text x="545" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#166534">Listener + Target Groups</text>
  <text x="545" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#166534">Path-based routing</text>

  <path d="M670 275 H760" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <polygon points="760,275 744,267 744,283" fill="#64748B"/>

  <rect x="760" y="170" width="320" height="210" rx="22" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
  <text x="920" y="205" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#92400E">ECS Cluster</text>

  <rect x="790" y="235" width="118" height="108" rx="16" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="849" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#78350F">Primary</text>
  <text x="849" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#78350F">ASG + Tasks</text>
  <text x="849" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#78350F">Fixed size</text>

  <rect x="930" y="235" width="118" height="108" rx="16" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="989" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#78350F">Secondary</text>
  <text x="989" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#78350F">ASG + Tasks</text>
  <text x="989" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#78350F">Scale on CPU</text>

  <path d="M560 420 L560 470 H1000" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M1000 470 H1000 420" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <rect x="430" y="460" width="230" height="120" rx="18" fill="#E0E7FF" stroke="#818CF8" stroke-width="2"/>
  <text x="545" y="500" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#312E81">EC2 Instances</text>
  <text x="545" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#312E81">ECS-optimized AMI</text>
  <text x="545" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#312E81">Security group + IAM role</text>

  <rect x="700" y="460" width="250" height="120" rx="18" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
  <text x="825" y="500" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#831843">Autoscaling</text>
  <text x="825" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#831843">CPU-based target tracking</text>
  <text x="825" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#831843">Secondary only</text>

  <path d="M849 343 V420" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M989 343 V420" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <path d="M545 360 V470" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M825 360 V470" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <text x="920" y="635" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">One shared ALB + one shared ECS cluster + per-service Terraform entries</text>
</svg>
